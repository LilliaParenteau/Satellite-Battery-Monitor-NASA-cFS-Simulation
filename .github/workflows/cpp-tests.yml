name: C++ Tests

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile battery logic tests
        run: |
          g++ -std=c++17 -Wall -Wextra -pedantic \
            tests/battery_test.cpp \
            fsw/src/battery_logic.cpp \
            -o battery_test

      - name: Run battery logic tests
        run: ./battery_test

      - name: Compile standalone demo
        run: |
          g++ -std=c++17 -Wall -Wextra -pedantic \
            demo/battery_demo.cpp \
            fsw/src/battery_logic.cpp \
            -o battery_demo

      - name: Test all simulation scenarios
        run: |
          for choice in 1 2 3
          do
            case "$choice" in
              1)
                name="Normal Operation"
                expected="Step 6 | Eclipse | Battery: 85%"
                ;;
              2)
                name="Extended Eclipse"
                expected="Step 4 | Eclipse | Battery: 75%"
                ;;
              3)
                name="High Power Consumption"
                expected="Step 6 | Eclipse | Battery: 65%"
                ;;
            esac

            output=$(printf '%s\n' "$choice" | ./battery_demo)

            grep -Fq "Running: $name" <<< "$output"
            grep -Fq "$expected" <<< "$output"
            grep -Fq "Simulation complete." <<< "$output"
          done

      - name: Test invalid scenario selection
        run: |
          if output=$(printf '4\n' | ./battery_demo); then
            echo "Invalid selection should return an error."
            exit 1
          fi

          grep -Fq "Invalid scenario selection." <<< "$output"